name: Deploy IPAK SKM

on:
  push:
    branches: [main]

jobs:
  quality:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Validate composer.json
        run: composer validate --strict --no-check-all || true

      - name: PHP Syntax Check
        run: |
          find application -name '*.php' -not -path '*/vendor/*' -exec php -l {} \;
